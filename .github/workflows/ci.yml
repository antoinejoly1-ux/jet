name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://jet:jet@localhost:5432/jet
  TEST_DATABASE_URL: postgresql://jet:jet@localhost:5432/jet_test
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-00
  BETTER_AUTH_URL: http://localhost:3000
  REQUIRE_STAFF_2FA: "true"

jobs:
  check:
    name: Typecheck, lint, format, unit and integration tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jet
          POSTGRES_PASSWORD: jet
          POSTGRES_DB: jet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jet" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test database
        run: psql postgresql://jet:jet@localhost:5432/jet -c "CREATE DATABASE jet_test OWNER jet;"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Migrations are up to date with the schema
        run: pnpm drizzle-kit check && pnpm drizzle-kit generate --name ci-drift && git diff --exit-code -- drizzle
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build

  e2e:
    name: End-to-end (desktop and phone)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jet
          POSTGRES_PASSWORD: jet
          POSTGRES_DB: jet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jet" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: mkdir -p tmp && pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
